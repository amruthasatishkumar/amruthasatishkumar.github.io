<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=20260218">
  </head>
  <body>
    <div class="layout">
      {% include sidebar.html %}
      <div class="backdrop" id="backdrop"></div>
      <main class="main">
        <header class="topbar">
          <button class="icon-button" id="sidebar-toggle" aria-label="Open sidebar">Menu</button>
          <span class="topbar-title">{{ page.title | default: site.title }}</span>
        </header>
        <div class="content">
          {{ content }}
        </div>
        <footer class="footer">
          <span>Updated {{ site.time | date: "%B %Y" }}</span>
        </footer>
      </main>
    </div>
    <script src="https://unpkg.com/simple-jekyll-search@1.10.0/dest/simple-jekyll-search.min.js"></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
