---
layout: default
---
<article class="post">
  <div class="post-header">
    <p class="post-meta">
      <span class="tag">{{ page.categories | first }}</span>
      <span>{{ page.date | date: "%B %d, %Y" }}</span>
    </p>
    <h1>{{ page.title }}</h1>
  </div>
  <div class="post-content">
    {{ content }}
  </div>
</article>
